services:

  frontend:
    build:
      context: ./client
      dockerfile: ../frontend/Dockerfile
    container_name: blog_frontend
    ports:
      - "3000:80"
    depends_on:
      - backend
    networks:
      - blog-network

  backend:
    build:
      context: ./api
      dockerfile: ../backend/Dockerfile
    container_name: blog_backend
    ports:
      - "5000:5000"
    environment:
      - NODE_ENV=development
      - PORT=5000
      - MONGO=mongodb://mongo:27017/mernblog
      - JWT_SECRET=myjwtsecretkey123
    depends_on:
      - mongo
    networks:
      - blog-network

  mongo:
    image: mongo:6
    container_name: blog_mongo
    ports:
      - "27017:27017"
    volumes:
      - mongo-data:/data/db
    networks:
      - blog-network

volumes:
  mongo-data:

networks:
  blog-network:
    driver: bridge
